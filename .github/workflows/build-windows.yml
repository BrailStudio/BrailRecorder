name: Build Brail Recorder for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ./ui
        run: npm install

      - name: Build frontend
        working-directory: ./ui
        run: npm run build
        
      - name: Install FFmpeg build tools
        shell: pwsh
        run: |
          choco install msys2 -y --no-progress
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm make diffutils"
          
      - name: Build Tauri Windows Installer
        working-directory: ./ui
        shell: pwsh
        env:
          PATH: "C:\\msys64\\usr\\bin;C:\\msys64\\mingw64\\bin;${{ env.PATH }}"
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Brail-Recorder-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
