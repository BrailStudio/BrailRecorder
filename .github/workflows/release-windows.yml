
name: Build Windows installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Brail Recorder (EXE + MSI)
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          npm install --prefix ui --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw "Frontend dependency installation failed"
          }

          npm run build --prefix ui
          if ($LASTEXITCODE -ne 0) {
            throw "Frontend build failed"
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "LLVM installation failed"
          }

          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned FFmpeg 7.1.2
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\vcpkg"
          $overlayRoot = "$env:RUNNER_TEMP\vcpkg-overlay"
          $ffmpegOverlay = Join-Path $overlayRoot "ffmpeg"

          # Download vcpkg
          git clone https://github.com/microsoft/vcpkg.git $root
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg clone failed"
          }

          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed"
          }

          # Exact vcpkg port tree for FFmpeg 7.1.2#5
          $ffmpegPortTree = "bf414f1e4f2a63ff7410444dc4eabb5b392f6d16"

          git -C $root cat-file -e "$ffmpegPortTree^{tree}"
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned FFmpeg port was not found in vcpkg"
          }

          New-Item -ItemType Directory -Force -Path $ffmpegOverlay |
            Out-Null

          $archive = "$env:RUNNER_TEMP\ffmpeg-port.tar"

          git -C $root archive `
            --format=tar `
            $ffmpegPortTree `
            --output="$archive"

          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract pinned FFmpeg port"
          }

          tar -xf $archive -C $ffmpegOverlay
          if ($LASTEXITCODE -ne 0) {
            throw "Could not unpack FFmpeg port"
          }

          # Install FFmpeg using the pinned overlay port
          & "$root\vcpkg.exe" install `
            "ffmpeg[nvcodec,amf,qsv]:x64-windows" `
            "--overlay-ports=$overlayRoot"

          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg installation failed"
          }

          $ffmpegDir = "$root\installed\x64-windows"

          # Verify the header that caused the previous failure
          $requiredHeader = Join-Path `
            $ffmpegDir "include\libavcodec\avfft.h"

          if (!(Test-Path $requiredHeader)) {
            throw "FFmpeg avfft.h is missing from the installation"
          }

          "VCPKG_ROOT=$root" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "VCPKG_DEFAULT_TRIPLET=x64-windows" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "FFMPEG_DIR=$ffmpegDir" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "PKG_CONFIG_PATH=$ffmpegDir\lib\pkgconfig" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Generate application icons
        shell: pwsh
        run: |
          cargo tauri icon src-tauri/icons/icon.svg --output src-tauri/icons
          if ($LASTEXITCODE -ne 0) {
            throw "Icon generation failed"
          }

          Copy-Item src-tauri/icons/32x32.png src-tauri/icons/tray.png -Force

      - name: Verify Rust dependency versions
        shell: pwsh
        run: |
          cargo tree -i ffmpeg-sys-next
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg Rust dependency verification failed"
          }

      - name: Build EXE and MSI
        shell: pwsh
        run: |
          cargo tauri build --bundles nsis,msi
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed"
          }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Brail-Recorder-Windows-x64
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          generate_release_notes: true
